spring:
  application:
    name: civicbrain-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/civicbrain}
    username: ${DB_USER:civic}
    password: ${DB_PASSWORD:civic}
  jpa:
    hibernate:
      ddl-auto: validate        # Flyway only, never "update"
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 6MB        # hard cap; the 5 MB rule is enforced (and reported) in code
      max-request-size: 20MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}

server:
  port: 8080
  forward-headers-strategy: none

app:
  jwt-secret: ${JWT_SECRET:}                 # >= 32 bytes; shared with the Next.js middleware
  otp-hmac-secret: ${OTP_HMAC_SECRET:}
  media-signing-secret: ${MEDIA_SIGNING_SECRET:}
  cookie-secure: ${COOKIE_SECURE:true}
  trust-proxy: ${TRUST_PROXY:false}          # honour X-Forwarded-For only behind our own proxy
  ward-count-fallback: ${WARD_COUNT:30}      # used until ward boundaries are uploaded (FR-M2)
  mail-from: ${MAIL_FROM:no-reply@civicbrain.local}
  seed-admin-email: ${SEED_ADMIN_EMAIL:}
  seed-admin-password: ${SEED_ADMIN_PASSWORD:}
  seed-admin-name: ${SEED_ADMIN_NAME:Super Admin}
  storage-dir: ${STORAGE_DIR:./uploads}
  scheduling-enabled: ${SCHEDULING_ENABLED:true}
